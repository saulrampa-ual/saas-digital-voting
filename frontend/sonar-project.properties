# SonarQube analysis of the frontend (F1, docs/architecture/quality-and-security.md).
# Run from frontend/ with: npx --yes @sonar/scan@5.0.2 -Dsonar.host.url=http://localhost:9000 -Dsonar.token=<token>
# (scripts/quality/sonar.ps1 does it). Host and token never go in this file.
sonar.projectKey=verivoto-frontend
sonar.projectName=VeriVoto · frontend
sonar.sources=src
sonar.tests=src,tests
sonar.test.inclusions=src/**/*.spec.ts,tests/**/*.ts
sonar.exclusions=src/**/*.spec.ts
sonar.sourceEncoding=UTF-8
# No coverage report yet: the Vitest coverage provider is not installed (see the guide).
