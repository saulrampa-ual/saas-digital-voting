# Security analysis (F2–F4 of docs/ai/PLAN.md): free alternatives to a commercial SAST such as Fortify.
# Details, baseline and how to run the same tools locally: docs/architecture/quality-and-security.md
#   secrets       gitleaks over the whole git history (blocking)
#   sast          Semgrep Community Edition, registry rulesets (blocking on ERROR; full report as artifact)
#   dependencies  Trivy on Maven and npm dependencies and on Dockerfile/config (blocking on fixable HIGH/CRITICAL)
#                 and npm audit of the production dependencies (blocking on high). Maven dependencies are resolved
#                 first (cached ~/.m2) and mounted into Trivy: otherwise Trivy downloads every parent POM from Maven
#                 Central and gets 429 Too Many Requests from the shared runner IP.
# Third-party actions are pinned to full commit SHAs (tag in the comment) and the scanners run from pinned versions,
# not from their own GitHub Actions: trivy-action and setup-trivy were compromised in March 2026 (GHSA-69fq-xp46-6x23).
name: security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '17 6 * * 6' # every Saturday, before the weekly dev -> main merge
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
  TRIVY_IMAGE: aquasec/trivy:0.76.1
  SEMGREP_VERSION: '1.183.0'

jobs:
  secrets:
    name: Secrets in the git history (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan every commit of every branch
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git --redact --no-banner --log-opts="--all" --exit-code 1 /repo

  sast:
    name: Static analysis (Semgrep CE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - run: pip install "semgrep==${SEMGREP_VERSION}"

      - name: Full report (every severity, never fails)
        run: |
          semgrep scan --metrics=off --disable-version-check \
            --config p/java --config p/typescript --config p/secrets --config p/owasp-top-ten \
            --config p/github-actions --config p/dockerfile \
            --sarif --output semgrep.sarif || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semgrep-report
          path: semgrep.sarif
          retention-days: 30

      - name: Gate (fails on ERROR findings)
        run: |
          semgrep scan --metrics=off --disable-version-check \
            --config p/java --config p/typescript --config p/secrets --config p/owasp-top-ten \
            --config p/github-actions --config p/dockerfile \
            --severity ERROR --error

  dependencies:
    name: Dependencies and configuration (Trivy, npm audit)
    runs-on: ubuntu-latest
    env:
      # Same flags for the report and the gate. The ~/.m2 cache lets Trivy read the POMs locally and the Trivy cache
      # keeps the vulnerability database between both runs (one download from ghcr.io instead of two).
      TRIVY_ARGS: >-
        fs --quiet --scanners vuln,misconfig,secret
        --skip-dirs Plantilla-TFM-Informatica-UAL --skip-dirs prototiposPantallas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/**/pom.xml

      - name: Resolve Maven dependencies into ~/.m2 (for Trivy)
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress dependency:resolve

      - name: Trivy report (every severity, never fails)
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm -v "$PWD:/src" -v "$HOME/.m2:/root/.m2:ro" -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            -w /src "$TRIVY_IMAGE" $TRIVY_ARGS --format table --output trivy-report.txt /src \
            || echo "::warning::Trivy report failed; the gate below decides"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Trivy gate (fixable HIGH and CRITICAL)
        run: |
          docker run --rm -v "$PWD:/src" -v "$HOME/.m2:/root/.m2:ro" -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            -w /src "$TRIVY_IMAGE" $TRIVY_ARGS --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /src

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: always()
        with:
          node-version: '24'

      - name: npm audit (production dependencies, high or above)
        if: always()
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
