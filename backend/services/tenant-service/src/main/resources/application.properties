spring.datasource.url=${TENANT_DB_URL:jdbc:postgresql://localhost:5432/tenant_service}
spring.datasource.username=${TENANT_DB_USERNAME}
spring.datasource.password=${TENANT_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${TENANT_OIDC_ISSUER_URI}
