server:
  port: ${GATEWAY_SERVER_PORT:8000}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-organizations
              uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/organizations,/api/v1/organizations/**
            - id: election
              uri: ${ELECTION_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/censuses,/api/v1/censuses/**,/api/v1/processes,/api/v1/processes/**

management:
  endpoints:
    web:
      exposure:
        include: health
