server:
  port: ${GATEWAY_SERVER_PORT:8000}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-organizations
              uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/organizations,/api/v1/organizations/**,/api/v1/admin-actions,/api/v1/admin-actions/**,/api/v1/api-keys,/api/v1/api-keys/**
            - id: election
              uri: ${ELECTION_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/censuses,/api/v1/censuses/**,/api/v1/processes,/api/v1/processes/**,/api/v1/privacy/**
            # Only the public voter endpoints; /internal/** is never routed (D-22)
            - id: voter-access
              uri: ${VOTER_ACCESS_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/voter-access/**
            - id: ballot-box
              uri: ${BALLOT_BOX_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/ballot-box/**

management:
  endpoints:
    web:
      exposure:
        include: health
