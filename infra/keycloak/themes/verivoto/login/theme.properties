parent=keycloak.v2
import=common/keycloak
# Same list as keycloak.v2 plus the VeriVoto layer (resources are looked up in the parent theme first if missing here)
styles=css/styles.css css/verivoto.css
# Card subtitle on the sign-in page and live password requirements (login-update-password.ftl)
scripts=js/verivoto.js
# One light look for the management login; the PatternFly dark class would clash with the navy panel
darkMode=false
# SR15: the "Volver a iniciar sesion" button of the error page opens the console, which starts a new sign-in (local environment)
vvConsoleUrl=http://localhost:4200/admin
