# Local development infrastructure for VeriVoto.
# Usage (from the repository root): docker compose -f infra/compose.yaml --env-file infra/.env up -d
# Development only: no TLS, published ports bound to 127.0.0.1.

name: verivoto

services:
  pg-main:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_MAIN_SUPERUSER_PASSWORD:?Define POSTGRES_MAIN_SUPERUSER_PASSWORD in infra/.env}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Define IDENTITY_DB_PASSWORD in infra/.env}
      ELECTION_DB_PASSWORD: ${ELECTION_DB_PASSWORD:?Define ELECTION_DB_PASSWORD in infra/.env}
      VOTER_ACCESS_DB_PASSWORD: ${VOTER_ACCESS_DB_PASSWORD:?Define VOTER_ACCESS_DB_PASSWORD in infra/.env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Define KEYCLOAK_DB_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-main-data:/var/lib/postgresql
      - ./postgres/main:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  pg-ballot:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_BALLOT_SUPERUSER_PASSWORD:?Define POSTGRES_BALLOT_SUPERUSER_PASSWORD in infra/.env}
      BALLOT_BOX_DB_PASSWORD: ${BALLOT_BOX_DB_PASSWORD:?Define BALLOT_BOX_DB_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg-ballot-data:/var/lib/postgresql
      - ./postgres/ballot:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Define KC_BOOTSTRAP_ADMIN_PASSWORD in infra/.env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://pg-main:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Define KEYCLOAK_DB_PASSWORD in infra/.env}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      # Placeholders resolved by the realm import (infra/keycloak/realm/verivoto-realm.json)
      VERIVOTO_SUPERADMIN_EMAIL: ${VERIVOTO_SUPERADMIN_EMAIL:?Define VERIVOTO_SUPERADMIN_EMAIL in infra/.env}
      VERIVOTO_SUPERADMIN_INITIAL_PASSWORD: ${VERIVOTO_SUPERADMIN_INITIAL_PASSWORD:?Define VERIVOTO_SUPERADMIN_INITIAL_PASSWORD in infra/.env}
      IDENTITY_SERVICE_CLIENT_SECRET: ${IDENTITY_SERVICE_CLIENT_SECRET:?Define IDENTITY_SERVICE_CLIENT_SECRET in infra/.env}
      ELECTION_SERVICE_CLIENT_SECRET: ${ELECTION_SERVICE_CLIENT_SECRET:?Define ELECTION_SERVICE_CLIENT_SECRET in infra/.env}
      BALLOT_BOX_SERVICE_CLIENT_SECRET: ${BALLOT_BOX_SERVICE_CLIENT_SECRET:?Define BALLOT_BOX_SERVICE_CLIENT_SECRET in infra/.env}
      VOTER_ACCESS_SERVICE_CLIENT_SECRET: ${VOTER_ACCESS_SERVICE_CLIENT_SECRET:?Define VOTER_ACCESS_SERVICE_CLIENT_SECRET in infra/.env}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      pg-main:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pg-main-data:
  pg-ballot-data:
