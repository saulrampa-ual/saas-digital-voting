# Backend verification includes the P7 test suite; frontend production build remains enabled.
name: build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and coverage (Java 25)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/**/pom.xml

      - name: Verify and package all services with tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

  infra:
    name: Infrastructure (Compose config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate infra/compose.yaml with placeholder values
        run: |
          sed -E 's/=\r?$/=ci-placeholder/' infra/.env.example > "$RUNNER_TEMP/ci.env"
          docker compose -f infra/compose.yaml --env-file "$RUNNER_TEMP/ci.env" config --quiet

  frontend:
    name: Frontend tests and build (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npm run test:ci

      - name: Production build
        run: npm run build
