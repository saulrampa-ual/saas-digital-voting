# Backend verification includes the P7 test suite; frontend production build remains enabled.
name: build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and coverage (Java 25)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/**/pom.xml

      - name: Verify and package all services with tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

  infra:
    name: Infrastructure (Compose config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate infra/compose.yaml with placeholder values
        run: |
          sed -E 's/=\r?$/=ci-placeholder/' infra/.env.example > "$RUNNER_TEMP/ci.env"
          docker compose -f infra/compose.yaml --env-file "$RUNNER_TEMP/ci.env" config --quiet

  frontend:
    name: Frontend tests and build (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npm run test:ci

      - name: Production build
        run: npm run build

  e2e-a11y:
    # A10: Playwright + axe on the voter flow, receipt check and management console. The API and Keycloak are
    # replaced by synthetic responses inside the tests, so no backend, secret or special runner is needed.
    name: Accessibility E2E (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run accessibility E2E tests
        run: npm run test:e2e
        env:
          # the runner context is not available in job-level env
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/verivoto-e2e

      - name: Upload axe results and Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-a11y-results
          path: ${{ runner.temp }}/verivoto-e2e
          retention-days: 14
